name: Release Desktop & Mobile Apps (Tauri 2)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build Vite frontend
        run: pnpm run build

      - name: Build Tauri Desktop Executable
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'AuraCast ${{ github.ref_name }}'
          releaseBody: 'Automated multi-platform release built with Tauri.'
          releaseDraft: true
          prerelease: false

      - name: Upload Windows Executable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AuraCast-Windows-Exe
          path: |
            src-tauri/target/release/app.exe
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build Vite frontend
        run: pnpm run build

      - name: Build Tauri Desktop Executable (Linux AppImage)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'AuraCast ${{ github.ref_name }}'
          releaseBody: 'Automated multi-platform release built with Tauri.'
          releaseDraft: true
          prerelease: false

      - name: Upload Linux Executable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AuraCast-Linux-AppImage
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb


  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - name: Install frontend dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build Vite frontend
        run: pnpm run build

      - name: Build Tauri Desktop Executable (macOS DMG & App)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'AuraCast ${{ github.ref_name }}'
          releaseBody: 'Automated multi-platform release built with Tauri.'
          releaseDraft: true
          prerelease: false
          args: --target universal-apple-darwin

      - name: Upload macOS Executable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AuraCast-macOS-Universal
          path: |
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo docker image prune --all --force

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 11076708
          packages: ""

      - name: Install Android NDK
        run: echo "y" | sdkmanager --install "ndk;27.0.12077973"

      - name: Set NDK Environment
        run: echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> $GITHUB_ENV

      - name: Accept Android Licenses
        run: yes | sdkmanager --licenses

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, i686-linux-android, x86_64-linux-android

      - name: Install frontend dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Init Tauri Android
        run: pnpm tauri android init --ci
        env:
          NDK_HOME: ${{ env.NDK_HOME }}
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
        continue-on-error: true

      - name: Build Vite frontend
        run: pnpm run build

      - name: Build Tauri Android APK
        run: pnpm tauri:android:build --apk --debug
        env:
          NDK_HOME: ${{ env.NDK_HOME }}
          ANDROID_HOME: ${{ env.ANDROID_HOME }}

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AuraCast-Android-APK
          path: src-tauri/gen/android/app/build/outputs/apk/universal/debug/*.apk
